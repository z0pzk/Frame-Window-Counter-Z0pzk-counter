name: Build Frame Window Counter (.geode)

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build-android64:
    name: Build Android64 (GD 2.2081 / Geode v5.11.2)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build Geode Mod (Android64)
        uses: geode-sdk/build-geode-mod@main
        with:
          platform: android64
          sdk: v5.11.2

  build-windows:
    name: Build Windows (GD 2.2081 / Geode v5.11.2)
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build Geode Mod (Windows)
        uses: geode-sdk/build-geode-mod@main
        with:
          platform: windows
          sdk: v5.11.2
